name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` not `install` — installs exactly the lockfile, and fails if
      # package.json and package-lock.json have drifted apart.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Placeholder Supabase credentials. The build never talks to Supabase,
      # but prerendering the static routes constructs a client during render
      # (the query hooks call createClient() in their body), and
      # createBrowserClient throws on a missing URL or key. A syntactically
      # valid URL is enough — no real project is contacted, and nothing here
      # is a secret.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
